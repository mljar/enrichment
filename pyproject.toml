[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enrichment"
version = "0.2.0"
description = "AI Data Enrichment for Pandas DataFrame"
authors = [
  { name = "MLJAR Sp. z o.o." }
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["dataframe", "enrichment", "openai", "sentiment"]
urls = { "Homepage" = "https://github.com/mljar/enrichment" }
requires-python = ">=3.9"
dependencies = [
  "pandas>=1.5.0",
  "httpx>=0.27.0",
  "tqdm>=4.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-cov>=4",
  "ruff>=0.6"
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.pytest.ini_options]
markers = [
  "live: makes a real, paid request to an external AI provider"
]
